<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mesin Pencari VSM (Vector Space Model + TF-IDF) untuk 1.000 Dokumen Bahasa Indonesia">
  <title>{% block title %}Mesin Pencari VSM{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="app-header">
    <div class="container header-container">
      <a href="/" class="brand-logo">
        <span class="logo-icon">🔍</span>
        <span class="logo-text">Search<span class="brand-accent">VSM</span></span>
      </a>
      <nav class="nav-links">
        <a href="/" class="nav-item">Dashboard</a>
        <a href="/preprocess" class="nav-item">Demo Preprocessing</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="app-footer">
    <div class="container footer-container">
      <p>&copy; 2026 UTS STKI - Sistem Temu Kembali Informasi (VSM + TF-IDF Engine)</p>
    </div>
  </footer>
</body>
</html>
