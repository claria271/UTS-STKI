{% extends "base.html" %}

{% block title %}{{ doc.judul }} - Detail Dokumen{% endblock %}

{% block content %}
<div class="container">
  <div class="detail-card">
    <div class="detail-header">
      <span class="doc-id-badge">Dokumen ID #{{ doc.id }}</span>
      <a href="javascript:history.back()" class="btn-back">&larr; Kembali ke Hasil</a>
    </div>

    <h1 class="detail-title">{{ doc.judul }}</h1>

    <div class="detail-body">
      <h3>Isi Lengkap Dokumen:</h3>
      <p class="detail-text">{{ doc.isi }}</p>
    </div>
  </div>
</div>
{% endblock %}
